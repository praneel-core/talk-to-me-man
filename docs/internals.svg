<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1199" width="920" height="1199" role="img" aria-label="Technical view of a dictation: which library or API handles each stage"><style>
:root{--fill:#f6f8fa;--stroke:#8c959f;--text:#1f2328;--sub:#59636e;--accent:#0969da;--accentfill:#ddf4ff;--tech:#ffffff}
@media (prefers-color-scheme:dark){:root{--fill:#161b22;--stroke:#6e7681;--text:#e6edf3;--sub:#9198a1;--accent:#58a6ff;--accentfill:#10243e;--tech:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.box{fill:var(--fill);stroke:var(--stroke);stroke-width:1.4}
.accent{fill:var(--accentfill);stroke:var(--accent);stroke-width:1.6}
.tech{fill:var(--tech);stroke:var(--stroke);stroke-width:1}
.ghost{fill:none;stroke:var(--stroke);stroke-width:1.2}
.t{font-size:15px;font-weight:600;fill:var(--text)}
.accentt{fill:var(--accent)}
.s{font-size:11.5px;fill:var(--sub)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:var(--text)}
.lib{fill:var(--accent);font-weight:700}
.d{fill:var(--sub)}
.hd{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:var(--sub)}
.num{fill:none;stroke:var(--stroke);stroke-width:1.2}
.n{font-size:12px;font-weight:600;fill:var(--sub)}
.ln{stroke:var(--stroke);stroke-width:1.6}
.dot{stroke:var(--stroke);stroke-width:1;stroke-dasharray:2 3}
.head{fill:var(--stroke)}
</style>
<rect class="accent" x="40" y="70" width="290" height="77" rx="12"/>
<circle class="num" cx="64" cy="108.5" r="12"/>
<text class="n" x="64" y="112.5" text-anchor="middle">1</text>
<text class="t accentt" x="88" y="105.5">Hold Right Option</text>
<text class="s" x="88" y="122.5">key press detected</text>
<rect class="tech" x="372" y="70" width="508" height="77" rx="12"/>
<text class="m" x="388" y="96.0"><tspan class="lib">pynput</tspan><tspan class="d">  keyboard.Listener, a macOS event tap</tspan></text>
<text class="m" x="388" y="113.0"><tspan class="lib">queue.SimpleQueue</tspan><tspan class="d">  the callback only queues “press”;</tspan></text>
<text class="m d" x="388" y="130.0">a worker thread does the slow work</text>
<path class="dot" d="M330,108.5 L372,108.5"/>
<rect class="box" x="40" y="173" width="290" height="77" rx="12"/>
<circle class="num" cx="64" cy="211.5" r="12"/>
<text class="n" x="64" y="215.5" text-anchor="middle">2</text>
<text class="t" x="88" y="208.5">Record</text>
<text class="s" x="88" y="225.5">mic opens, start sound</text>
<rect class="tech" x="372" y="173" width="508" height="77" rx="12"/>
<text class="m" x="388" y="199.0"><tspan class="lib">sounddevice</tspan><tspan class="d">  InputStream (PortAudio → CoreAudio)</tspan></text>
<text class="m d" x="388" y="216.0">16 kHz mono float32, chunks kept as numpy arrays</text>
<text class="m" x="388" y="233.0"><tspan class="lib">afplay</tspan><tspan class="d">  plays the start sound</tspan></text>
<path class="dot" d="M330,211.5 L372,211.5"/>
<rect class="box" x="40" y="276" width="290" height="77" rx="12"/>
<circle class="num" cx="64" cy="314.5" r="12"/>
<text class="n" x="64" y="318.5" text-anchor="middle">3</text>
<text class="t" x="88" y="311.5">Live feedback</text>
<text class="s" x="88" y="328.5">runs in parallel while recording</text>
<rect class="tech" x="372" y="276" width="508" height="77" rx="12"/>
<text class="m" x="388" y="302.0"><tspan class="lib">PyObjC / AppKit</tspan><tspan class="d">  NSPanel + NSVisualEffectView pill, 60 fps</tspan></text>
<text class="m" x="388" y="319.0"><tspan class="lib">rumps</tspan><tspan class="d">  menu bar app; ⌥ icon from SF Symbols</tspan></text>
<text class="m d" x="388" y="336.0">mic loudness (RMS) drives the bars</text>
<path class="dot" d="M330,314.5 L372,314.5"/>
<rect class="box" x="40" y="379" width="290" height="77" rx="12"/>
<circle class="num" cx="64" cy="417.5" r="12"/>
<text class="n" x="64" y="421.5" text-anchor="middle">4</text>
<text class="t" x="88" y="414.5">Release</text>
<text class="s" x="88" y="431.5">mic closes, stop sound</text>
<rect class="tech" x="372" y="379" width="508" height="77" rx="12"/>
<text class="m" x="388" y="405.0"><tspan class="lib">afplay</tspan><tspan class="d">  plays the stop sound (Tink)</tspan></text>
<text class="m" x="388" y="422.0"><tspan class="lib">numpy</tspan><tspan class="d">  np.concatenate → one float32 array</tspan></text>
<text class="m" x="388" y="439.0"><tspan class="lib">threading</tspan><tspan class="d">  own thread; a lock keeps MLX single-threaded</tspan></text>
<path class="dot" d="M330,417.5 L372,417.5"/>
<rect class="box" x="40" y="482" width="290" height="60" rx="12"/>
<circle class="num" cx="64" cy="512.0" r="12"/>
<text class="n" x="64" y="516.0" text-anchor="middle">5</text>
<text class="t" x="88" y="509.0">Speech check</text>
<text class="s" x="88" y="526.0">silence and noise are dropped</text>
<rect class="tech" x="372" y="482" width="508" height="60" rx="12"/>
<text class="m" x="388" y="508.0"><tspan class="lib">numpy</tspan><tspan class="d">  RMS of every 30 ms frame, first 0.3 s skipped</tspan></text>
<text class="m d" x="388" y="525.0">(our own start sound leaks into the mic)</text>
<path class="dot" d="M330,512.0 L372,512.0"/>
<rect class="accent" x="40" y="568" width="290" height="77" rx="12"/>
<circle class="num" cx="64" cy="606.5" r="12"/>
<text class="n" x="64" y="610.5" text-anchor="middle">6</text>
<text class="t accentt" x="88" y="603.5">Transcribe</text>
<text class="s" x="88" y="620.5">audio → text, fully on-device</text>
<rect class="tech" x="372" y="568" width="508" height="77" rx="12"/>
<text class="m" x="388" y="594.0"><tspan class="lib">mlx-whisper</tspan><tspan class="d">  whisper-large-v3-turbo, MLX on the Apple GPU</tspan></text>
<text class="m d" x="388" y="611.0">prompt = a punctuated sentence + your word list</text>
<text class="m" x="388" y="628.0"><tspan class="lib">Hugging Face cache</tspan><tspan class="d">  weights downloaded once (~1.5 GB)</tspan></text>
<path class="dot" d="M330,606.5 L372,606.5"/>
<rect class="box" x="40" y="671" width="290" height="60" rx="12"/>
<circle class="num" cx="64" cy="701.0" r="12"/>
<text class="n" x="64" y="705.0" text-anchor="middle">7</text>
<text class="t" x="88" y="698.0">Clean up</text>
<text class="s" x="88" y="715.0">light, rule-based</text>
<rect class="tech" x="372" y="671" width="508" height="60" rx="12"/>
<text class="m" x="388" y="697.0"><tspan class="lib">re</tspan><tspan class="d">  regex removes um/uh, tidies spacing, capitalises</tspan></text>
<text class="m d" x="388" y="714.0">drops Whisper echoing its own prompt</text>
<path class="dot" d="M330,701.0 L372,701.0"/>
<rect class="box" x="40" y="757" width="290" height="60" rx="12"/>
<circle class="num" cx="64" cy="787.0" r="12"/>
<text class="n" x="64" y="791.0" text-anchor="middle">8</text>
<text class="t" x="88" y="784.0">Spoken punctuation?</text>
<text class="s" x="88" y="801.0">“comma”, “quotes” → edit last paste, stop</text>
<rect class="tech" x="372" y="757" width="508" height="60" rx="12"/>
<text class="m" x="388" y="783.0"><tspan class="lib">textproc</tspan><tspan class="d">  dict lookup, edits the previous text</tspan></text>
<text class="m" x="388" y="800.0"><tspan class="lib">pynput</tspan><tspan class="d">  Shift+Left selects it, Cmd+V pastes the fix</tspan></text>
<path class="dot" d="M330,787.0 L372,787.0"/>
<rect class="accent" x="40" y="843" width="290" height="94" rx="12"/>
<circle class="num" cx="64" cy="890.0" r="12"/>
<text class="n" x="64" y="894.0" text-anchor="middle">9</text>
<text class="t accentt" x="88" y="887.0">Correction cue?</text>
<text class="s" x="88" y="904.0">“no”, “I mean”, repeats → Ollama</text>
<rect class="tech" x="372" y="843" width="508" height="94" rx="12"/>
<text class="m" x="388" y="869.0"><tspan class="lib">re</tspan><tspan class="d">  cue regex decides whether the LLM is needed</tspan></text>
<text class="m" x="388" y="886.0"><tspan class="lib">urllib</tspan><tspan class="d">  POST localhost:11434/api/chat (localhost only)</tspan></text>
<text class="m" x="388" y="903.0"><tspan class="lib">Ollama</tspan><tspan class="d">  qwen2.5:3b, temperature 0, minimal-edit prompt</tspan></text>
<text class="m d" x="388" y="920.0">guard: reworded by >15% → keep original</text>
<path class="dot" d="M330,890.0 L372,890.0"/>
<rect class="box" x="40" y="963" width="290" height="60" rx="12"/>
<circle class="num" cx="64" cy="993.0" r="12"/>
<text class="n" x="64" y="997.0" text-anchor="middle">10</text>
<text class="t" x="88" y="990.0">Paste</text>
<text class="s" x="88" y="1007.0">into the focused app</text>
<rect class="tech" x="372" y="963" width="508" height="60" rx="12"/>
<text class="m" x="388" y="989.0"><tspan class="lib">pyperclip</tspan><tspan class="d">  pbcopy / pbpaste for the clipboard</tspan></text>
<text class="m" x="388" y="1006.0"><tspan class="lib">pynput</tspan><tspan class="d">  Cmd+V, then the old clipboard is restored</tspan></text>
<path class="dot" d="M330,993.0 L372,993.0"/>
<rect class="accent" x="40" y="1049" width="290" height="60" rx="12"/>
<circle class="num" cx="64" cy="1079.0" r="12"/>
<text class="n" x="64" y="1083.0" text-anchor="middle">11</text>
<text class="t accentt" x="88" y="1076.0">Confirm</text>
<text class="s" x="88" y="1093.0">done</text>
<rect class="tech" x="372" y="1049" width="508" height="60" rx="12"/>
<text class="m" x="388" y="1075.0"><tspan class="lib">overlay</tspan><tspan class="d">  check mark appears, then the pill fades away</tspan></text>
<text class="m" x="388" y="1092.0"><tspan class="lib">collections.deque</tspan><tspan class="d">  last 5 texts → Recent dictations (memory only)</tspan></text>
<path class="dot" d="M330,1079.0 L372,1079.0"/>
<path class="ln" d="M185.0,147 L185.0,166"/>
<polygon class="head" points="185.0,173 180.5,164 189.5,164"/>
<path class="ln" d="M185.0,250 L185.0,269"/>
<polygon class="head" points="185.0,276 180.5,267 189.5,267"/>
<path class="ln" d="M185.0,353 L185.0,372"/>
<polygon class="head" points="185.0,379 180.5,370 189.5,370"/>
<path class="ln" d="M185.0,456 L185.0,475"/>
<polygon class="head" points="185.0,482 180.5,473 189.5,473"/>
<path class="ln" d="M185.0,542 L185.0,561"/>
<polygon class="head" points="185.0,568 180.5,559 189.5,559"/>
<path class="ln" d="M185.0,645 L185.0,664"/>
<polygon class="head" points="185.0,671 180.5,662 189.5,662"/>
<path class="ln" d="M185.0,731 L185.0,750"/>
<polygon class="head" points="185.0,757 180.5,748 189.5,748"/>
<path class="ln" d="M185.0,817 L185.0,836"/>
<polygon class="head" points="185.0,843 180.5,834 189.5,834"/>
<path class="ln" d="M185.0,937 L185.0,956"/>
<polygon class="head" points="185.0,963 180.5,954 189.5,954"/>
<path class="ln" d="M185.0,1023 L185.0,1042"/>
<polygon class="head" points="185.0,1049 180.5,1040 189.5,1040"/>
<text class="hd" x="40" y="44">STAGE</text>
<text class="hd" x="372" y="44">WHAT RUNS IT</text>
<rect class="ghost" x="40" y="1135" width="840" height="44" rx="12" stroke-dasharray="5 4"/>
<text class="m" x="56" y="1154"><tspan class="lib">Always running</tspan><tspan class="d">  OllamaMonitor thread polls GET /api/ps every 3 s,</tspan></text>
<text class="m d" x="56" y="1171">loads the model when Ollama comes up and drives the status dot on the icon.</text>
</svg>
