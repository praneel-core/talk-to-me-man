[project]
name = "dictate"
version = "0.1.0"
description = "Free, local push-to-talk dictation for Apple Silicon Macs (Whisper + optional Ollama cleanup)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mlx-whisper",
    "sounddevice",
    "pynput",
    "pyperclip",
    "numpy",
    "rumps",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["dictate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
